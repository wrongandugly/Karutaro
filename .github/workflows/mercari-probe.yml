name: mercari-probe
on:
  push:
    paths:
      - 'mercari-probe/**'
      - '.github/workflows/mercari-probe.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: playwright install --with-deps chromium
      - run: python mercari-probe/probe.py
      - run: |
          git config user.name "karutaro-probe"
          git config user.email "probe@wrongandugly.local"
          git add mercari-probe/resultado.json
          git commit -m "probe: resultado" || echo "sem mudancas"
          git push
