name: karutaro-hunt
on:
  issues:
    types: [opened]
  push:
    paths:
      - 'wants.json'
  workflow_dispatch:
  schedule:
    - cron: '15 */6 * * *'
permissions:
  contents: write
  issues: write
concurrency: karutaro-hunt
jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: playwright install --with-deps chromium
      - name: Scrapling (resgate final furtivo)
        continue-on-error: true
        run: pip install "scrapling[fetchers]"
      - name: Navegador do Scrapling
        continue-on-error: true
        run: scrapling install
      - name: Peneira (Trafilatura)
        continue-on-error: true
        run: pip install trafilatura
      - name: Disfarce leve (curl_cffi)
        continue-on-error: true
        run: pip install curl_cffi
      - name: Intake (issue da pagina -> wants.json)
        if: github.event_name == 'issues'
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: python3 intake.py
      - name: A cacada
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 hunter.py
      - name: Grava o caderno
        run: |
          git config user.name "karutaro"
          git config user.email "karutaro@wrongandugly.local"
          for f in wants.json board.json hunter.log facts.json rep.json changes.json heartbeat.json watch.json shout-log.json plans.json track.json; do [ -e "$f" ] && git add "$f"; done
          for f in results-*.json; do [ -e "$f" ] && git add "$f"; done
          git commit -m "caca: entrega atualizada" || echo "sem mudancas"
          git push
      - name: Avisa quem pediu (comentario na issue)
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NO: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NO" --body "Karutaro voltou da caca. A entrega esta na pagina: https://wrongandugly.github.io/Karutaro/ - atualiza a pagina pra ver."
