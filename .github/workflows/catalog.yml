name: karutaro-catalog
on:
  workflow_dispatch:
  push:
    paths:
      - 'catalog-request.json'
permissions:
  contents: write
concurrency: karutaro-catalog
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Monta o catalogo
        run: python3 catalog.py
      - name: Prova de leitura do Datasette
        run: |
          pip install datasette
          datasette inspect catalogo.db
      - name: Grava o catalogo
        run: |
          git config user.name "karutaro"
          git config user.email "karutaro@wrongandugly.local"
          for f in catalogo.db; do [ -e "$f" ] && git add "$f"; done
          git commit -m "catalogo: catalogo.db gerado das fichas" || echo "sem mudancas"
          git push
