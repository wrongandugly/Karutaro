name: karutaro-discover
on:
  workflow_dispatch:
  push:
    paths:
      - 'discover-request.json'
permissions:
  contents: write
concurrency: karutaro-discover
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Descobre
        run: python3 discover.py
      - name: Grava o resultado
        run: |
          git config user.name "karutaro"
          git config user.email "karutaro@wrongandugly.local"
          for f in discover-result.json; do [ -e "$f" ] && git add "$f"; done
          git commit -m "discover: resultado da descoberta" || echo "sem mudancas"
          git push
