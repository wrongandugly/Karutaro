name: karutaro-selftest
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'
permissions:
  contents: write
  issues: write
concurrency: karutaro-selftest
jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Auto-teste do olho (gabarito)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 hunter.py --selftest
      - name: Grava o resultado
        run: |
          git config user.name "karutaro"
          git config user.email "karutaro@wrongandugly.local"
          for f in selftest.json heartbeat.json rep.json shout-log.json changes.json facts.json; do [ -e "$f" ] && git add "$f"; done
          git commit -m "auto-teste: resultado da semana" || echo "sem mudancas"
          git push
